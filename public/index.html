<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>License System</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
      background: #f4f4f4;
    }
    h1 {
      color: #333;
    }
    input, select, button {
      margin: 5px;
      padding: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #333;
      color: white;
    }
    button {
  cursor: pointer;
  background: #2563eb;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  font-weight: bold;
    }
  </style>
</head>
<body>

<h1>License Management System</h1>

<!-- CREATE LICENSE -->
<h2>Add License</h2>
<input type="text" id="name" placeholder="Holder Name">
<input type="text" id="type" placeholder="Type">
<input type="date" id="issueDate">
<input type="date" id="expiryDate">
<button onclick="addLicense()">Add</button>

<!-- LICENSE TABLE -->
<h2>All Licenses</h2>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>License No</th>
      <th>Name</th>
      <th>Type</th>
      <th>Status</th>
      <th>Violation</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="licenseTable"></tbody>
</table>

<script>
const API = "http://localhost:3000/api/licenses";

// LOAD DATA
async function loadLicenses() {
  const res = await fetch(API);
  const data = await res.json();

  const table = document.getElementById("licenseTable");
  table.innerHTML = "";

  data.forEach(l => {
    table.innerHTML += `
      <tr>
        <td>${l.id}</td>
        <td>${l.licenseNumber}</td>
        <td>${l.holderName}</td>
        <td>${l.type}</td>
        <td>${l.status}</td>
        <td>${l.violation || "-"}</td>
        <td>
          <button onclick="deleteLicense(${l.id})">Delete</button>
          <button onclick="updateStatus(${l.id})">Change Status</button>
        </td>
      </tr>
    `;
  });
}

// ADD LICENSE
async function addLicense() {
  const holderName = document.getElementById("name").value;
  const type = document.getElementById("type").value;
  const issueDate = document.getElementById("issueDate").value;
  const expiryDate = document.getElementById("expiryDate").value;

  if (!holderName || !type || !issueDate || !expiryDate) {
    alert("Fill all fields!");
    return;
  }

  await fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ holderName, type, issueDate, expiryDate })
  });

  loadLicenses();
}

// DELETE LICENSE
async function deleteLicense(id) {
  await fetch(`${API}/${id}`, {
    method: "DELETE"
  });

  loadLicenses();
}

// UPDATE STATUS
async function updateStatus(id) {
  const status = prompt("Enter status (active, expired, suspended, revoked, blocked):");
  const violation = prompt("Enter violation (optional):");

  if (!status) return;

  await fetch(`${API}/${id}/status`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ status, violation })
  });

  loadLicenses();
}

// INITIAL LOAD
loadLicenses();
</script>

</body>
</html>
